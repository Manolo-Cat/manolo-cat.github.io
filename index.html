<style>
  :root{
    --bg:#F5F5F7;
    --card:#FFFFFF;
    --text:#1D1D1F;
    --text-2:#6E6E73;
    --sep:rgba(60,60,67,.16);
    --fill:#E8E8ED;
    --thumb:#FFFFFF;
    --blue:#0071E3;
    --link:#0066CC;
    --tint:rgba(0,113,227,.10);
    --green:#248A3D;
    --red:#D70015;
    --orange:#FF9500;
    --ok:#248A3D;
    --warn:#B25000;
    --due:#D70015;
    --bar:rgba(245,245,247,.8);
    --sheet:rgba(250,250,252,.94);
    --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000000;
      --card:#1C1C1E;
      --text:#F5F5F7;
      --text-2:#A1A1A6;
      --sep:rgba(84,84,88,.65);
      --fill:#2C2C2E;
      --thumb:#636366;
      --link:#2997FF;
      --tint:rgba(10,132,255,.18);
      --ok:#30D158;
      --warn:#FF9F0A;
      --due:#FF453A;
      --bar:rgba(0,0,0,.72);
      --sheet:rgba(44,44,46,.94);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
    font-size:17px;line-height:1.47;letter-spacing:-.022em;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;letter-spacing:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* Barra superior translúcida (el nombre aparece al hacer scroll) */
  .nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
    background:transparent;border-bottom:1px solid transparent;transition:background .25s,border-color .25s}
  .nav.solid{background:var(--bar);border-bottom-color:var(--sep);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  .nav-in{max-width:560px;margin:0 auto;height:52px;padding:0 16px;
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
  .nav-title{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
  .nav.titled .nav-title{opacity:1;transform:none}
  .seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--fill)}
  .seg button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--text);
    font-size:13px;font-weight:600;letter-spacing:-.01em;min-height:32px;padding:0 12px;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
  .flag{flex:none;display:block;width:21px;height:14px;border-radius:3px;box-shadow:0 0 0 .5px rgba(0,0,0,.2)}

  main{max-width:560px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom))}

  /* Aviso de gato perdido */
  .lost{display:flex;gap:14px;align-items:flex-start;margin:4px 0 14px;padding:16px 18px;border-radius:18px;
    background:var(--red);color:#fff}
  .lost svg{flex:none;margin-top:2px}
  .lost strong{display:block;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
  .lost p{margin:4px 0 0;font-size:15px;line-height:1.4}

  /* Foto de cabecera */
  .poster{position:relative;margin-top:4px;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#1C1C1E;
    box-shadow:0 24px 48px -28px rgba(0,0,0,.5)}
  .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    animation:settle 1.4s cubic-bezier(.22,1,.36,1) both}
  .poster.still img{animation:none}
  @keyframes settle{from{transform:scale(1.07);opacity:0}to{transform:none;opacity:1}}

  h1{margin:22px 4px 0;font-family:var(--display);font-size:clamp(34px,10.5vw,52px);line-height:1.05;
    font-weight:700;letter-spacing:-.03em}
  .lede{margin:8px 4px 0;font-family:var(--display);font-size:21px;line-height:1.33;font-weight:600;
    letter-spacing:-.02em;color:var(--text-2)}
  .note{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--card)}
  .note p{margin:0;font-size:15px;line-height:1.42}
  .icon-tile{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
  .icon-tile.orange{background:var(--orange)}

  /* Familia */
  .family{display:grid;gap:12px;margin-top:22px}
  .person{padding:16px;border-radius:18px;background:var(--card)}
  .person-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(180deg,#A5ABB8,#858994);color:#fff;font-size:19px;font-weight:600;letter-spacing:0}
  .pname{font-size:17px;font-weight:600;line-height:1.25}
  .pnum{font-size:15px;color:var(--text-2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .person-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .person-actions.solo{grid-template-columns:1fr}
  .act{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;
    font-size:17px;font-weight:600}
  .act-call{background:var(--green);color:#fff}
  .act-msg{background:var(--tint);color:var(--link)}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 16px;
    border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600;line-height:1.25;
    text-align:center;cursor:pointer}
  .act:active,.cta:active,.pill:active{opacity:.7}

  /* Secciones tipo lista de iOS */
  section{margin-top:34px}
  h2{margin:0 4px 10px;font-family:var(--display);font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
  .group{background:var(--card);border-radius:18px;overflow:hidden}
  .list > *{position:relative}
  .list > * + *::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;min-height:48px;padding:12px 16px}
  .row .v{color:var(--text-2);text-align:right}
  .row.stack{display:block}
  .row.stack .k{display:block;font-size:13px;color:var(--text-2)}
  .row.stack .v{display:block;margin-top:2px;color:var(--text);text-align:left}
  .row.title{font-weight:600}
  a.row .v{color:var(--link)}
  a.row .v svg{margin-left:8px;vertical-align:-1px;color:var(--text-2);opacity:.6}

  .steps{list-style:none;margin:0;padding:0}
  .steps li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
  .list.steps > li + li::before{left:56px}
  .num{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;display:grid;place-items:center;
    background:var(--blue);color:#fff;font-size:14px;font-weight:700;letter-spacing:0}
  .steps p{margin:0;font-size:16px;line-height:1.42}

  .prose{margin:0;padding:14px 16px;font-size:16px;line-height:1.47}

  .chip-num{padding:16px 16px 4px;font-family:var(--display);font-size:clamp(22px,6.4vw,28px);font-weight:700;
    letter-spacing:.01em;word-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip-help{margin:0;padding:0 16px 14px;font-size:15px;color:var(--text-2)}
  .chip-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 16px 16px}
  .pill{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:0;border-radius:999px;
    background:var(--tint);color:var(--link);font-size:15px;font-weight:600;cursor:pointer}

  .vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
  .vname{font-weight:500}
  .vdates{display:flex;flex-wrap:wrap;gap:0 14px;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .badge{flex:none;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
  .badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .badge.soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .badge.due{color:var(--due);background:color-mix(in srgb,var(--due) 13%,transparent)}

  footer{margin-top:36px;text-align:center;font-size:13px;color:var(--text-2);letter-spacing:-.01em}
  footer p{margin:0 0 4px}

  /* Hoja inferior para elegir a quién enviar la ubicación */
  .backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,0);transition:background .3s}
  .backdrop[hidden]{display:none}
  .backdrop.open{background:rgba(0,0,0,.4)}
  .sheet{width:100%;max-width:560px;padding:0 8px calc(8px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
  .backdrop.open .sheet{transform:none}
  .sheet-group{border-radius:14px;overflow:hidden;text-align:center;background:var(--sheet);
    -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
  .sheet-head{padding:14px 16px 12px}
  .sheet-title{margin:0;font-size:13px;font-weight:600;color:var(--text-2)}
  .sheet-status{margin:2px 0 0;font-size:13px;color:var(--text-2);min-height:1.4em}
  .sheet-btn{display:block;width:100%;min-height:57px;border:0;border-top:1px solid var(--sep);background:transparent;
    color:var(--link);font-size:20px;letter-spacing:-.02em;cursor:pointer}
  .sheet-btn:active{background:var(--fill)}
  .sheet-btn[disabled]{opacity:.45;cursor:progress}
  .sheet-cancel{margin-top:8px;border:0;border-radius:14px;background:var(--card);font-weight:600}

  @media (prefers-reduced-motion:reduce){
    .poster img{animation:none}
    .sheet,.backdrop,.nav,.nav-title{transition:none}
  }
</style>
</head>

  location: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.6 3.4 3.9 10.3c-.85.35-.75 1.58.15 1.78l6.55 1.45 1.45 6.55c.2.9 1.43 1 1.78.15z"/></svg>',
  house: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.2 2.8 11a.8.8 0 0 0 .52 1.4H5V20a1 1 0 0 0 1 1h4v-5.5h4V21h4a1 1 0 0 0 1-1v-7.6h1.68A.8.8 0 0 0 21.2 11z"/></svg>',
  alert: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M12 6.8v6.4" stroke="#D70015" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="#D70015"/></svg>',
  flagES: '<svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg>',
  flagGB: '<svg class="flag" viewBox="0 0 60 40" preserveAspectRatio="none" aria-hidden="true"><clipPath id="gb-t"><path d="M30,20h30v20zv20h-30zh-30v-20zv-20h30z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0,0L60,40M60,0L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0L60,40M60,0L0,40" clip-path="url(#gb-t)" stroke="#C8102E" stroke-width="5"/><path d="M30,0v40M0,20h60" stroke="#fff" stroke-width="12"/><path d="M30,0v40M0,20h60" stroke="#C8102E" stroke-width="7"/></svg>',
  chev: '<svg width="8" height="13" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

const PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='#E8E8ED'/>" +
  "<g fill='none' stroke='#86868B' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'>" +
  "<path d='M58 92 L52 46 L86 68 Q100 64 114 68 L148 46 L142 92 Q150 104 150 118 Q150 156 100 156 Q50 156 50 118 Q50 104 58 92 Z'/>" +
  "<path d='M94 126 L100 132 L106 126'/><path d='M70 128 L40 124 M70 136 L42 142 M130 128 L160 124 M130 136 L158 142'/></g>" +
  "<circle cx='82' cy='110' r='5' fill='#86868B'/><circle cx='118' cy='110' r='5' fill='#86868B'/></svg>"
);

const app = document.getElementById("app");
const $ = s => document.querySelector(s);
let lang = (() => {
  try { const s = localStorage.getItem("lang"); if (s === "es" || s === "en") return s; } catch (e) {}
  return /^(es|ca|gl|eu)\b/i.test(navigator.language || "") ? "es" : "en";
})();
let firstRender = true, io = null, locPromise = null, lastFocus = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tx = v => (v && typeof v === "object") ? (v[lang] || v.es || v.en || "") : (v ?? "");
const fem = () => GATO.sexo === "hembra";
const T = (k, vars = {}) => { const s = UI[lang][k]; return typeof s === "function" ? s({ f: fem(), ...vars }) : s; };
const parse = s => { if (!s) return null; const [y, m, d] = String(s).split("-").map(Number); return y ? new Date(y, (m || 1) - 1, d || 1) : null; };
const fmt = (s, month = "long") => { const d = parse(s); return d ? new Intl.DateTimeFormat(lang === "es" ? "es-ES" : "en-GB", { day: "numeric", month, year: "numeric" }).format(d) : ""; };
const telHref = p => "tel:" + String(p).replace(/[^\d+]/g, "");
const waNum = p => String(p).replace(/\D/g, "");
const msgHref = (o, text) => o.whatsapp
  ? `https://wa.me/${waNum(o.telefono)}?text=${encodeURIComponent(text)}`
  : `sms:${String(o.telefono).replace(/[^\d+]/g, "")}?&body=${encodeURIComponent(text)}`;
const today = (() => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; })();

function ageText() {
  const b = parse(GATO.nacimiento);
  if (!b) return tx(GATO.edad);
  let m = (today.getFullYear() - b.getFullYear()) * 12 + (today.getMonth() - b.getMonth());
  if (today.getDate() < b.getDate()) m--;
  if (m < 0) return tx(GATO.edad);
  return m < 12 ? UI[lang].months(m) : UI[lang].years(Math.floor(m / 12));
}

function vaxStatus(s) {
  const d = parse(s); if (!d) return "";
  const days = (d - today) / 864e5;
  return days < 0 ? "due" : days <= 30 ? "soon" : "ok";
}

function rowsSection(title, rows) {
  rows = rows.filter(r => r[1]);
  if (!rows.length) return "";
  return `<section><h2>${esc(title)}</h2><div class="group list">${rows.map(([k, v]) =>
    `<div class="row${String(v).length > 26 ? " stack" : ""}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`
  ).join("")}</div></section>`;
}

function render() {
  const G = GATO, f = fem();
  const owners = (G.duenos || []).filter(o => o && o.telefono);
  const chip = String(G.chip || "").replace(/\s/g, "");
  document.documentElement.lang = lang;
  document.title = T("docTitle", { n: G.nombre });

  let h = `<header class="nav" id="nav"><div class="nav-in">
      <span class="nav-title" aria-hidden="true">${esc(G.nombre)}</span>
      <div class="seg" role="group" aria-label="${esc(T("langGroup"))}">
        <button type="button" data-lang="es" lang="es" aria-pressed="${lang === "es"}">${ICON.flagES}<span>Español</span></button>
        <button type="button" data-lang="en" lang="en" aria-pressed="${lang === "en"}">${ICON.flagGB}<span>English</span></button>
      </div>
    </div></header><main>`;

  if (G.perdido) {
    const line = (G.perdidoDesde || tx(G.zonaPerdido)) ? T("lostLine", { fecha: fmt(G.perdidoDesde), zona: tx(G.zonaPerdido) }) : "";
    h += `<div class="lost" role="alert">${ICON.alert}<div><strong>${esc(T("lostTitle", { n: G.nombre }))}</strong>` +
         (line ? `<p>${esc(line)}</p>` : "") +
         (tx(G.recompensa) ? `<p>${esc(T("reward", { r: tx(G.recompensa) }))}</p>` : "") +
         `</div></div>`;
  }

  h += `<div class="poster${firstRender ? "" : " still"}">
      <img id="foto" src="${esc(G.foto || window.FOTO_INCRUSTADA || PLACEHOLDER)}" alt="${esc(T("photoAlt", { n: G.nombre }))}" width="1080" height="1080" fetchpriority="high">
    </div>
    <h1 id="hero-name">${esc(T("hi", { n: G.nombre }))}</h1>
    <p class="lede">${esc(T("lede"))}</p>`;
  firstRender = false;

  if (tx(G.aviso)) {
    h += `<div class="note"><span class="icon-tile orange">${ICON.house}</span><p>${esc(tx(G.aviso))}</p></div>`;
  }

  if (owners.length) {
    h += `<div class="family">`;
    for (const o of owners) {
      const initial = String(o.nombre || "?").trim().charAt(0).toUpperCase();
      h += `<div class="person">
        <div class="person-head"><span class="avatar" aria-hidden="true">${esc(initial)}</span>
          <div><div class="pname">${esc(o.nombre)}</div><div class="pnum">${esc(o.telefono)}</div></div></div>
        <div class="person-actions${o.whatsapp ? "" : " solo"}">
          <a class="act act-call" href="${telHref(o.telefono)}" aria-label="${esc(T("callAria", { n: o.nombre }))}">${ICON.phone}<span>${esc(T("call"))}</span></a>
          ${o.whatsapp ? `<a class="act act-msg" href="${esc(msgHref(o, T("waMsg", { n: G.nombre })))}" aria-label="${esc(T("waAria", { n: o.nombre }))}">${ICON.bubble}<span>WhatsApp</span></a>` : ""}
        </div></div>`;
    }
    h += `<button class="cta" id="share" type="button">${ICON.location}<span>${esc(T("shareLoc"))}</span></button></div>`;
  }

  h += `<section><h2>${esc(T("hFound"))}</h2><ol class="group list steps">${
    T("steps", { chip: !!chip, many: owners.length > 1 }).map((s, i) => `<li><span class="num" aria-hidden="true">${i + 1}</span><p>${esc(s)}</p></li>`).join("")
  }</ol></section>`;

  h += rowsSection(T("hAbout"), [
    [T("breed"), tx(G.raza)],
    [T("color"), tx(G.color)],
    [T("sex"), G.sexo ? T(f ? "female" : "male") : ""],
    [T("age"), ageText()],
    [T("weight"), tx(G.peso)],
    [T("neutered"), G.esterilizado === true ? T("yes") : G.esterilizado === false ? T("no") : ""],
    [T("marks"), tx(G.senas)],
  ]);

  if (tx(G.caracter)) {
    h += `<section><h2>${esc(T("hChar"))}</h2><div class="group"><p class="prose">${esc(tx(G.caracter))}</p></div></section>`;
  }

  if (chip) {
    h += `<section><h2>${esc(T("hChip"))}</h2><div class="group">
      <div class="chip-num">${esc(chip.replace(/(\d{3})(?=\d)/g, "$1 "))}</div>
      <p class="chip-help">${esc(T("chipHelp", { reg: tx(G.registro) }))}${tx(G.pasaporte) ? `<br>${esc(T("passport", { p: tx(G.pasaporte) }))}` : ""}</p>
      <div class="chip-actions">
        <button class="pill" id="copy" type="button">${esc(T("copy"))}</button>
        <a class="pill" href="https://www.reiac.es/" target="_blank" rel="noopener">${esc(T("reiac"))}</a>
      </div></div></section>`;
  }

  const S = G.salud || {};
  h += rowsSection(T("hHealth"), [
    [T("conditions"), tx(S.enfermedades)],
    [T("allergies"), tx(S.alergias)],
    [T("meds"), tx(S.medicacion)],
    [T("diet"), tx(S.alimentacion)],
  ]);

  const vax = (G.vacunas || []).filter(v => v && tx(v.nombre));
  if (vax.length) {
    h += `<section><h2>${esc(T("hVax"))}</h2><div class="group list">${vax.map(v => {
      const st = vaxStatus(v.proxima);
      const dates = T("vdates", { last: fmt(v.fecha, "short"), next: fmt(v.proxima, "short") });
      return `<div class="vrow"><div><div class="vname">${esc(tx(v.nombre))}</div>${dates.length ? `<div class="vdates">${dates.map(d => `<span>${esc(d)}</span>`).join("")}</div>` : ""}</div>` +
        (st ? `<span class="badge ${st}">${esc(T({ ok: "sOk", soon: "sSoon", due: "sDue" }[st]))}</span>` : "") + `</div>`;
    }).join("")}</div></section>`;
  }

  const V = G.veterinario || {};
  if (tx(V.nombre) || V.telefono) {
    const mapQ = encodeURIComponent([tx(V.nombre), tx(V.direccion)].filter(Boolean).join(", "));
    h += `<section><h2>${esc(T("hVet"))}</h2><div class="group list">
      ${tx(V.nombre) ? `<div class="row title">${esc(tx(V.nombre))}</div>` : ""}
      ${tx(V.direccion) ? `<a class="row" href="https://www.google.com/maps/search/?api=1&amp;query=${mapQ}" target="_blank" rel="noopener"><span class="k">${esc(T("address"))}</span><span class="v">${esc(tx(V.direccion))}${ICON.chev}</span></a>` : ""}
      ${V.telefono ? `<a class="row" href="${telHref(V.telefono)}"><span class="k">${esc(T("phone"))}</span><span class="v">${esc(V.telefono)}${ICON.chev}</span></a>` : ""}
    </div></section>`;
  }

  h += `<footer>${G.actualizado ? `<p>${esc(T("updated", { d: fmt(G.actualizado) }))}</p>` : ""}<p>${esc(T("thanks"))}</p></footer></main>`;

  h += `<div class="backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-group">
        <div class="sheet-head"><p class="sheet-title" id="sheet-title">${esc(T("sheetTitle"))}</p><p class="sheet-status" id="sheet-status" aria-live="polite"></p></div>
        ${owners.map((o, i) => `<button class="sheet-btn send" type="button" data-i="${i}">${esc(o.nombre)}</button>`).join("")}
      </div>
      <button class="sheet-btn sheet-cancel" id="sheet-cancel" type="button">${esc(T("cancel"))}</button>
    </div></div>`;

  app.innerHTML = h;

  // Foto: si el archivo indicado no carga, usa la incrustada; si tampoco hay, un dibujo
  const img = $("#foto");
  img.addEventListener("error", function fallback() {
    const next = (window.FOTO_INCRUSTADA && img.src !== window.FOTO_INCRUSTADA) ? window.FOTO_INCRUSTADA : PLACEHOLDER;
    if (img.src !== next) img.src = next; else img.removeEventListener("error", fallback);
  });

  // Idioma
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
    document.querySelector(`.seg button[data-lang="${lang}"]`).focus();
  }));

  // Barra superior: fondo al hacer scroll, nombre cuando la foto sale de pantalla
  const nav = $("#nav");
  const onScroll = () => nav.classList.toggle("solid", window.scrollY > 4);
  window.removeEventListener("scroll", window.__navScroll || (() => {}));
  window.__navScroll = onScroll;
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  if (io) io.disconnect();
  if ("IntersectionObserver" in window) {
    io = new IntersectionObserver(([e]) => nav.classList.toggle("titled", !e.isIntersecting && e.boundingClientRect.top < 0),
      { rootMargin: "-56px 0px 0px 0px" });
    io.observe($("#hero-name"));
  }

  // Microchip
  const copyBtn = $("#copy");
  if (copyBtn) copyBtn.addEventListener("click", () => copyText(chip, copyBtn));

  // Compartir ubicación
  const share = $("#share");
  if (share) share.addEventListener("click", openSheet);
  const sheet = $("#sheet");
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
  $("#sheet-cancel").addEventListener("click", closeSheet);
  sheet.querySelectorAll(".send").forEach(b => b.addEventListener("click", () => sendTo(owners[+b.dataset.i])));
}

function getPosition() {
  return new Promise(resolve => {
    if (!("geolocation" in navigator)) return resolve(null);
    navigator.geolocation.getCurrentPosition(p => resolve(p), () => resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}

function openSheet() {
  const sheet = $("#sheet"), status = $("#sheet-status");
  lastFocus = document.activeElement;
  sheet.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add("open")));
  status.textContent = T("locating");
  sheet.querySelectorAll(".send").forEach(b => { b.disabled = false; });
  locPromise = getPosition();
  locPromise.then(p => { if (!sheet.hidden) status.textContent = p ? T("locReady") : T("locFail"); });
  const first = sheet.querySelector(".send");
  if (first) first.focus();
}

function closeSheet() {
  const sheet = $("#sheet");
  if (sheet.hidden) return;
  sheet.classList.remove("open");
  const done = () => { sheet.hidden = true; if (lastFocus) lastFocus.focus(); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 320);
}

async function sendTo(o) {
  if (!o) return;
  const sheet = $("#sheet"), status = $("#sheet-status");
  const btns = sheet.querySelectorAll(".send");
  btns.forEach(b => { b.disabled = true; });
  const p = await locPromise;
  let text = T("waMsg", { n: GATO.nombre });
  if (p) text += "\n" + T("waLoc", { link: `https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}` });
  status.textContent = T("opening");
  location.href = msgHref(o, text);
  setTimeout(() => { btns.forEach(b => { b.disabled = false; }); }, 2500);
}

function copyText(text, btn) {
  const done = () => { btn.textContent = T("copied"); setTimeout(() => { btn.textContent = T("copy"); }, 2000); };
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, legacy);
  else legacy();
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// Se dibuja cuando el navegador ha leído todo el archivo (incluida la foto del final)
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render);
else render();
</script>
